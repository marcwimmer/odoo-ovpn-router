# Host-specific values come from .env next to this file (see .env.example).
# Without .env the defaults below apply.
name: ${WG_COMPOSE_PROJECT:-wireguard_zebroo}

services:
  server:
    build:
      context: ./Server
      # "runtime" is the production image; "debug" adds nmap and tcpdump.
      target: ${WG_BUILD_TARGET:-runtime}
    restart: unless-stopped
    network_mode: host
    # No "privileged": the container only needs to manage network interfaces,
    # routes and iptables in the host network namespace.
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun
    volumes:
      - type: bind
        source: ${WG_DATA_DIR:-/etc/wg.data}
        target: /data
      - type: bind
        source: ${WG_SETTINGS_DIR:-/opt/wireguard_zebroo/settings}
        target: /root/settings
    environment:
      - FOLDER_DATA=/data
      - FOLDER_KEYS=/data/keys
      - FOLDER_CLIENTS=/data/clients
      - FILE_SETTINGS=/root/settings/settings.json
      - WG_IFACE=${WG_IFACE:-wg1}
      - WG_NET=${WG_NET:-10.222.0.0/22}
    command: /root/bin/run.sh
