type: minor
breaking: false
description: |
  VPN → Groups → Gruppe öffnen: neuer Bereich „Rules“. Jede Zeile erlaubt genau
  eine Verbindung: von Mitglied, zu Mitglied, Protokoll (TCP/UDP), Port. Die
  Gegenseite darf antworten, aber keine eigene Verbindung aufbauen.
  Ohne Regeln bleibt alles wie bisher: alle Ports in beide Richtungen.
  Mit Regeln gelten nur diese, Hubs spielen dann keine Rolle.
  „From“ und „To“ bieten nur Mitglieder der Gruppe an: ein neues Mitglied
  zuerst unter „Members“ eintragen.
  Mit der ersten Regel wird „Enforce rules“ gesetzt: Wer die letzte Regel
  löscht, sperrt die Gruppe ganz (siehe Fragment gruppen-sperren).

  Testen:
  1. VPN → Groups → Gruppe öffnen, Regel anlegen, Button „Apply to VPN Server“.
  2. In settings.json steht die Regel unter „group_rules“, die Gruppe fehlt
     unter „custom_routes“.
  3. Vom Mitglied „From“ zum Mitglied „To“ auf dem Port verbinden, z. B.
     `nc -vz <IP von To> <Port>` oder `ssh`: die Verbindung steht.
     Von „To“ zu „From“ oder auf einem anderen Port: kein Fehler, sondern
     ein Timeout, weil der Server das Paket still verwirft.
  4. Ein Mitglied außerhalb der Gruppe, dieselbe Regel doppelt, gleiches
     Mitglied bei „From“ und „To“ oder Port 0 wird beim Speichern abgelehnt.

  Weitere sichtbare Folgen:
  - Regeln mit einem archivierten Mitglied gehen nicht mehr an den Server.
    Bleibt keine Regel übrig, ist die Gruppe ganz gesperrt.
  - Änderungen an den Regeln lösen wie Mitgliederänderungen eine
    Infra-Benachrichtigung aus.

  Voraussetzung: auf dem VPN-Server läuft die apply-clients.py aus diesem Stand,
  sonst ignoriert der Server die Regeln und die Gruppe ist ganz gesperrt.
