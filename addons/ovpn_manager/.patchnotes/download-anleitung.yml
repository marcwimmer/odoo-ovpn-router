type: minor
breaking: false
description: |
  Download-Seite (/download/byhash/vpn/…): Nach der Passwort-Eingabe steht unter
  „Installation Guide“ jetzt eine Anleitung je Gerät (macOS, Windows, iPhone/iPad,
  Linux) mit nummerierten Schritten, Screenshots und einem Schritt „Verbindung
  prüfen“. Es erscheinen nur die Geräte, die zur Auslieferungsart des Members
  passen (Config-Datei, Skript mit Server- oder Client-Schlüssel, TCP/443 mit
  wstunnel). Statt „myserver.conf“ steht der echte Dateiname da. Oben rechts
  schaltet man zwischen Deutsch und Englisch um.
  Testen: je Auslieferungsart einen Member öffnen, den Download-Link aufrufen und
  prüfen, dass nur die passenden Geräte und Dateinamen erscheinen.
